name: Build GZ AutoReplay

# Roda sozinho a cada alteração na branch main, ou manualmente
# (aba Actions > Build GZ AutoReplay > Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rodar testes unitários
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Guardar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: app/build/reports/tests/
          retention-days: 7

  apk:
    name: Gerar APK
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessário para publicar o APK em Releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar se a chave de assinatura existe
        id: chave
        env:
          GZ_KEYSTORE_BASE64: ${{ secrets.GZ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GZ_KEYSTORE_BASE64" ]; then
            echo "assinada=true" >> "$GITHUB_OUTPUT"
            echo "Chave de assinatura encontrada: o APK será assinado com a chave oficial."
          else
            echo "assinada=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chave de assinatura NÃO configurada. Será gerado um APK de teste (debug), que não poderá ser atualizado por cima de um APK assinado com a chave oficial. Veja docs/ASSINATURA.md."
          fi

      - name: Preparar chave de assinatura
        if: steps.chave.outputs.assinada == 'true'
        env:
          GZ_KEYSTORE_BASE64: ${{ secrets.GZ_KEYSTORE_BASE64 }}
        run: |
          echo "$GZ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gz-release.jks"
          echo "GZ_KEYSTORE_PATH=$RUNNER_TEMP/gz-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          GZ_KEYSTORE_PASSWORD: ${{ secrets.GZ_KEYSTORE_PASSWORD }}
          GZ_KEY_ALIAS: ${{ secrets.GZ_KEY_ALIAS }}
          GZ_KEY_PASSWORD: ${{ secrets.GZ_KEY_PASSWORD }}
        run: |
          N="${{ github.run_number }}"
          mkdir -p "$RUNNER_TEMP/saida"
          if [ "${{ steps.chave.outputs.assinada }}" = "true" ]; then
            gradle :app:assembleRelease -PgzVersionCode="$N" --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/saida/GZ-AutoReplay-build$N.apk"
            echo "APK_PATH=$RUNNER_TEMP/saida/GZ-AutoReplay-build$N.apk" >> "$GITHUB_ENV"
            echo "APK_TIPO=assinado com a chave oficial" >> "$GITHUB_ENV"
          else
            gradle :app:assembleDebug -PgzVersionCode="$N" --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/saida/GZ-AutoReplay-build$N-DEBUG.apk"
            echo "APK_PATH=$RUNNER_TEMP/saida/GZ-AutoReplay-build$N-DEBUG.apk" >> "$GITHUB_ENV"
            echo "APK_TIPO=DEBUG (sem chave oficial)" >> "$GITHUB_ENV"
          fi

      - name: Conferir assinatura do APK
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: gz-autoreplay-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ github.run_number }}"
          gh release create "build-$N" "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "GZ AutoReplay - build $N" \
            --notes "APK $APK_TIPO. Commit ${{ github.sha }}."
